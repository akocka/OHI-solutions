<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<link rel="stylesheet" href="/demo/orobianco/assets/fonts/fonts.css"><title>Mockup C</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#070605;color:#efe6d6;font-family:Manrope,system-ui,sans-serif}
.h{position:relative;min-height:100vh;display:grid;place-items:center;overflow:hidden;padding:110px 20px 60px}
.h::before{content:"";position:absolute;left:50%;top:52%;width:min(90vh,88vw);height:min(90vh,88vw);transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(201,164,106,.16),transparent 62%)}
nav{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:30px 6vw;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#bfb29c}
nav b{font:400 20px 'Cormorant Garamond',serif;letter-spacing:.42em;color:#efe6d6}nav .m{display:flex;gap:36px}
.plate{position:relative;width:min(56vh,74vw);aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 60px 120px -30px rgba(0,0,0,.9),0 0 0 1px rgba(201,164,106,.35),0 0 0 14px rgba(201,164,106,.05)}
.plate img{width:100%;height:100%;object-fit:cover;object-position:50% 72%;transform:scale(1.35)}
.t{position:relative;text-align:center;margin-top:-6vh}
.t small{display:block;font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:#c9a46a}
.t h1{font:300 clamp(58px,8.6vw,150px)/.9 'Cormorant Garamond',serif;margin:14px 0 12px;background:linear-gradient(180deg,#f6e9cc,#c9a46a);-webkit-background-clip:text;background-clip:text;color:transparent}
.t p{font:italic 300 clamp(18px,1.5vw,23px) 'Cormorant Garamond',serif;color:#cfc3ae}
.t a{display:inline-block;margin-top:30px;padding:16px 40px;background:linear-gradient(180deg,#e2c690,#b88f52);color:#16110a;text-decoration:none;font-size:11px;font-weight:700;letter-spacing:.32em;text-transform:uppercase}
@media(max-width:760px){nav .m{display:none}.t{margin-top:-4vh}.t a{width:100%}}
</style></head><body>
<section class="h"><nav><b>OROBIANCO</b><div class="m"><span>Meniu</span><span>Evenimente</span><span>Despre</span><span>Rezervări</span></div><span>RO · HU · EN</span></nav>
<div style="display:grid;justify-items:center"><div class="plate"><img src="pasta-g.jpg" alt=""></div>
<div class="t"><small>Ristorante · Târgu Mureș</small><h1>Orobianco</h1><p>Seri lungi, vin bun, paste ca în Italia.</p><a href="#">Rezervă o masă</a></div></div></section>
</body></html>
